name: Build & Release

# Runs when module.json's version is changed and pushed to main.
# To release: bump "version" in module.json (e.g. "7.0.0" or "7.0.0-beta") and
# merge/push to main. Builds the bundle and creates a tag + GitHub Release with
# the packaged module. Skips (via tag-exists check) if that version was already
# released. Does not publish to the FoundryVTT package API — install via manifest
# URL from the GitHub Release.

on:
  push:
    branches: [main]
    paths:
      - 'module.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_ITEMS: 'assets/ css/ dist/ lang/ packs/ templates/ README.md logo.webp module.json'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from module.json
        id: version
        run: |
          VERSION=$(jq -r '.version' module.json)
          TAG="v$VERSION"
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ -(beta|test|rc[0-9]*)$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag already exists
        uses: mukunku/tag-exists-action@v1.6.0
        id: check_tag
        with:
          tag: ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: npm ci || npm install

      - name: Stamp manifest with release URLs
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ steps.version.outputs.tag }}"
          tmp="$(mktemp)"
          jq \
            --arg url "https://github.com/$REPO" \
            --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
            --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
            '.url = $url | .manifest = $manifest | .download = $download' \
            module.json > "$tmp" && mv "$tmp" module.json
          echo "Stamped module.json:"
          jq '{id, version, url, manifest, download}' module.json

      - name: Build bundle
        if: steps.check_tag.outputs.exists == 'false'
        run: npm run build

      - name: Package release zip
        if: steps.check_tag.outputs.exists == 'false'
        run: zip -r module.zip module.json LICENSE $PACKAGE_ITEMS

      - name: Create tag and GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          draft: false
          files: |
            module.json
            module.zip
